name: Problema (bug)
description: Algo não funciona como esperado
labels: ["bug"]
body:
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava?
    validations:
      required: true
  - type: textarea
    id: ocorreu
    attributes:
      label: O que aconteceu? (mensagem de erro completa)
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
  - type: input
    id: versao
    attributes:
      label: Versão do código, do ROS 2 e do hardware
